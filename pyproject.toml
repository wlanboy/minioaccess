[project]
name = "minioaccess"
version = "0.1.0"
description = "Web-Oberfläche zur Verwaltung von MinIO-Benutzern, Buckets und Policies über den mc-Client"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "python-dotenv>=1.2.4",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
